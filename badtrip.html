<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badtrip • Designer Psicodélico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=Pacifico&family=Bangers&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --neon-pink: #ff2ea6;
      --neon-orange: #ff9a18;
      --neon-green: #65ff7a;
      --violet: #5b2ee6;
      --card-bg: rgba(10, 8, 23, 0.72);
      --glass: rgba(255, 255, 255, 0.08);
      --text: #f8f5ff;
      --shadow-strong: 0 24px 45px rgba(0, 0, 0, 0.52);
      --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: "Montserrat", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: clamp(12px, 3vw, 28px);
      overflow-x: hidden;
      background:
        radial-gradient(55% 55% at 25% 20%, rgba(255, 19, 127, 0.34), transparent 75%),
        radial-gradient(60% 60% at 80% 18%, rgba(111, 0, 255, 0.32), transparent 70%),
        radial-gradient(circle at 50% 100%, rgba(0, 224, 255, 0.2), transparent 60%),
        linear-gradient(130deg, #0d0416, #12072c 40%, #050510 95%);
      animation: pulseBg 8s ease-in-out infinite alternate;
    }

    .container {
      position: relative;
      width: min(100%, 560px);
      border-radius: 26px;
      overflow: clip;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)),
        var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: var(--shadow-strong);
      backdrop-filter: blur(6px);
      isolation: isolate;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: conic-gradient(from 240deg, rgba(255, 46, 166, 0.28), rgba(101, 255, 122, 0.24), rgba(255, 154, 24, 0.3), rgba(255, 46, 166, 0.28));
      filter: blur(14px);
      z-index: -1;
      pointer-events: none;
    }

    .top-art {
      width: calc(100% - 32px);
      margin: 16px auto 8px;
      height: clamp(220px, 36vh, 300px);
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      position: relative;
      background-image:
        linear-gradient(to top, rgba(5, 2, 10, 0.35), rgba(5, 2, 10, 0.1)),
        url("https://images.unsplash.com/photo-1604871000636-074fa5117945?auto=format&fit=crop&w=1200&q=80");
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 28px rgba(255, 46, 166, 0.34);
    }

    .proxima-btn {
      position: absolute;
      right: 14px;
      bottom: 12px;
      border: 2px solid var(--neon-pink);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--neon-pink);
      font-family: "Pacifico", cursive;
      font-size: clamp(1.1rem, 2.8vw, 1.45rem);
      line-height: 1;
      padding: 8px 18px 10px;
      text-shadow: 0 0 10px rgba(255, 46, 166, 0.95);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 15px rgba(255, 46, 166, 0.65), inset 0 0 10px rgba(255, 46, 166, 0.25);
      transform: rotate(-4deg);
    }

    .main-title {
      text-align: center;
      margin: 24px 16px 4px;
      display: grid;
      gap: 2px;
      transform: rotate(-1.8deg);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nome-da {
      font-family: "Spicy Rice", cursive;
      font-size: clamp(2.25rem, 8vw, 3.8rem);
      line-height: 0.92;
      color: var(--neon-orange);
      text-shadow: 2px 2px 0 #000, 0 0 18px rgba(255, 154, 24, 0.95);
    }

    .musica {
      font-family: "Spicy Rice", cursive;
      font-size: clamp(2.8rem, 10vw, 4.8rem);
      line-height: 0.88;
      color: var(--neon-pink);
      text-shadow: 2px 2px 0 #000, 0 0 22px rgba(255, 46, 166, 0.95);
    }

    .neon-arrow {
      position: absolute;
      right: clamp(12px, 3vw, 20px);
      top: clamp(370px, 56vh, 410px);
      width: clamp(80px, 20vw, 96px);
      height: clamp(54px, 11vw, 66px);
      background: linear-gradient(130deg, #7bff83, #00f6d0 74%);
      clip-path: polygon(0 38%, 58% 38%, 58% 0, 100% 50%, 58% 100%, 58% 62%, 0 62%);
      border: 2px solid rgba(255, 46, 166, 0.95);
      border-radius: 8px;
      box-shadow: inset 0 0 18px rgba(255, 46, 166, 0.6), 0 0 18px rgba(101, 255, 122, 0.75);
      transform: rotate(-10deg);
      z-index: 3;
      animation: wiggle 1.9s ease-in-out infinite;
    }

    .playlist-box {
      margin: 22px 20px 88px;
      background: rgba(0, 0, 0, 0.82);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 14px;
      width: min(79%, 390px);
      box-shadow: var(--shadow-soft);
      position: relative;
      z-index: 2;
    }

    .playlist-title {
      margin-bottom: 10px;
      font-family: "Bangers", cursive;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.1em;
      color: #ffffff;
      text-transform: uppercase;
    }

    .songs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .song-item {
      list-style: none;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 9px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f8f3ff;
      background: linear-gradient(120deg, rgba(79, 22, 146, 0.9), rgba(50, 28, 90, 0.9));
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    .song-item:hover {
      background: linear-gradient(120deg, var(--neon-pink), var(--neon-orange));
      color: #0f0617;
      transform: translateY(-2px);
      cursor: pointer;
    }

    .logo-box {
      position: absolute;
      bottom: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 20px 0 0 0;
      background: rgba(0, 0, 0, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-left: 1px solid rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.04em;
      font-size: clamp(1.1rem, 2.6vw, 1.45rem);
      z-index: 4;
    }

    .sparkle {
      color: #d9d7ff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.95);
      font-size: 1.2em;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-10deg) translateY(0); }
      50% { transform: rotate(-7deg) translateY(-4px); }
    }

    @keyframes pulseBg {
      from { filter: saturate(1); }
      to { filter: saturate(1.15); }
    }

    @media (max-width: 560px) {
      .playlist-box {
        width: calc(100% - 40px);
        margin-bottom: 90px;
      }

      .neon-arrow {
        top: auto;
        bottom: 178px;
      }

      .songs-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="container" aria-label="Layout Badtrip psicodélico">
    <section class="top-art" aria-label="Arte principal do álbum">
      <button class="proxima-btn" type="button" aria-label="Próxima música">PRÓXIMA</button>
    </section>

    <h1 class="main-title" aria-label="Nome da música em destaque">
      <span class="nome-da">NOME DA</span>
      <span class="musica">MÚSICA</span>
    </h1>

    <div class="neon-arrow" aria-hidden="true"></div>

    <section class="playlist-box" aria-label="Lista de próximas músicas">
      <h2 class="playlist-title">Pilha de músicas</h2>
      <ul class="songs-grid">
        <li class="song-item">Into the Void</li>
        <li class="song-item">Mang Hing</li>
        <li class="song-item">Cosmic Spiral</li>
        <li class="song-item">The Bengal</li>
        <li class="song-item">Mind Bender</li>
        <li class="song-item">10: Space</li>
      </ul>
    </section>

    <footer class="logo-box" aria-label="Marca">
      badtrip <span class="sparkle" aria-hidden="true">✦</span>
    </footer>
  </main>
</body>
</html>
