<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>invicta - PLAYER</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Ops+One&family=Bungee&family=Changa+One:wght@400;700&display=swap");

:root {
  --bg: #0c0320;
  --paper: #e2a35f;
  --violet: #401978;
  --pink: #e30e6e;
  --pink-2: #ff2a8a;
  --cream: #f6e9ca;
  --deep: #06010f;
  --white: #f8f6ff;
  --cyan: #37dbe8;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  --border: rgba(255, 255, 255, 0.18);
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  scroll-behavior: smooth;
  min-height: 100%;
}

body { overflow-x: hidden; }

.section {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
}

.section-player {
  background: linear-gradient(90deg, #02084d 0%, #87648d 100%);
  max-width: 1440px;
  margin: 0 auto;
}

.scene-top {
  min-height: 52vh;
  background: url("./assets/1000473514.jpg") center center / cover no-repeat;
  position: relative;
  padding: clamp(16px, 2vw, 28px) clamp(14px, 3vw, 42px) clamp(18px, 3vw, 30px);
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  isolation: isolate;
  gap: 18px;
  flex-wrap: wrap;
}

.scene-label {
  position: absolute;
  top: 14px;
  left: 6vw;
  font-size: clamp(20px, 2vw, 34px);
  font-weight: 1000;
  color: var(--cream);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
  z-index: 3;
}

.player-frame {
  position: relative;
  width: min(88vw, 780px);
  aspect-ratio: 1.55 / 1;
  margin: clamp(74px, 7vw, 90px) 0 0 clamp(2px, 2vw, 20px);
  background: linear-gradient(135deg, var(--pink), #d00f5d);
  border-radius: 34px;
  box-shadow: var(--shadow);
  padding: 24px;
  isolation: isolate;
  z-index: 2;
}

.player-frame::before {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 40px;
  background:
    linear-gradient(90deg, #000 50%, transparent 50%) 0 0 / 28px 10px repeat-x,
    linear-gradient(90deg, #000 50%, transparent 50%) 0 100% / 28px 10px repeat-x,
    linear-gradient(0deg, #000 50%, transparent 50%) 0 0 / 10px 28px repeat-y,
    linear-gradient(0deg, #000 50%, transparent 50%) 100% 0 / 10px 28px repeat-y;
  z-index: -1;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.28));
}

#player {
  width: 100%;
  height: 100%;
  border-radius: 18px;
  overflow: hidden;
  background: #140313;
}

.player-actions {
  position: absolute;
  right: clamp(16px, 3vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  z-index: 3;
}

.arrow-btn, .square-btn {
  appearance: none;
  border: 0;
  cursor: pointer;
  font-weight: 1000;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  box-shadow: var(--shadow);
}

.square-btn {
  background: #0f0222;
  color: #fff;
  border-radius: 16px;
  padding: 16px 18px;
  min-width: 96px;
  font-size: 14px;
}

.arrow-btn {
  clip-path: polygon(0 0, 72% 0, 100% 50%, 72% 100%, 0 100%, 12% 50%);
  background: #fff;
  color: #111;
  min-width: 190px;
  min-height: 72px;
  font-size: clamp(18px, 1.8vw, 28px);
  padding: 0 34px 0 26px;
}

.scene-bottom {
  padding: clamp(20px, 2.8vw, 30px) clamp(14px, 4vw, 56px) clamp(40px, 6vw, 72px);
  min-height: 44vh;
  display: grid;
  grid-template-columns: minmax(250px, 360px) 1fr;
  gap: clamp(18px, 2.4vw, 30px);
  align-items: start;
}

.queue-card {
  background: #000;
  color: #f6e9ca;
  border-radius: 30px;
  min-height: 360px;
  padding: 18px 16px;
  box-shadow: var(--shadow);
  max-height: 68vh;
  overflow: hidden;
}

.queue-card h3 {
  margin: 0 0 16px;
  font-size: 18px;
  line-height: 1.1;
  text-transform: uppercase;
  font-style: italic;
  letter-spacing: 0.03em;
}

#playlist-resultado {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: min(58vh, 620px);
  overflow: auto;
  padding-right: 4px;
}

#playlist-resultado::-webkit-scrollbar { width: 8px; }
#playlist-resultado::-webkit-scrollbar-thumb { background: #6e5c7f; border-radius: 999px; }

.track-item {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 10px;
  border-radius: 18px;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.track-item.active {
  background: rgba(227, 14, 110, 0.32);
  border-color: rgba(255, 255, 255, 0.25);
}

.track-number {
  width: 28px;
  height: 28px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: #fff;
  color: #26053d;
  font-size: 13px;
  font-weight: 1000;
  margin-top: 2px;
}

.track-category {
  font-size: 11px;
  font-weight: 1000;
  color: #ffd5ea;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}

.track-title {
  font-size: 13px;
  line-height: 1.4;
  color: #fff;
}

.empty-state {
  color: #c9bdda;
  font-size: 13px;
  line-height: 1.5;
  padding: 8px 4px;
}

.info-wrap { padding-top: 14px; }

#nome-musica-destaque {
  margin: 0 0 18px;
  text-align: center;
  font-size: clamp(30px, 4vw, 62px);
  line-height: 1;
  text-transform: uppercase;
  font-weight: 1000;
  color: #fff;
  font-style: italic;
  text-shadow:
    -3px -3px 0 #c31663,
    3px -3px 0 #c31663,
    -3px 3px 0 #c31663,
    3px 3px 0 #c31663,
    0 8px 20px rgba(0, 0, 0, 0.35);
}

.status-line {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.status-pill {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.35;
  color: #fff;
}

.status-pill strong {
  color: #ffe7f2;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 12px;
}

.advanced-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(6, 1, 15, 0.78);
  backdrop-filter: blur(6px);
  z-index: 50;
  padding: 20px;
}

.advanced-overlay.show { display: flex; }

.advanced-modal {
  width: min(1100px, 96vw);
  max-height: 90vh;
  overflow: auto;
  background: linear-gradient(180deg, rgba(245, 245, 255, 0.97), rgba(235, 227, 245, 0.96));
  color: #1b1031;
  border-radius: 28px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  padding: 24px;
}

.advanced-head {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  margin-bottom: 18px;
}

.advanced-head h2 {
  margin: 0;
  font-size: clamp(24px, 2.5vw, 40px);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #43188a;
}

.advanced-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(240px, 1fr));
  gap: 12px;
}

.input-group {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-radius: 16px;
  background: #fff;
  border: 1px solid rgba(67, 24, 138, 0.12);
}

.input-group label {
  font-size: 14px;
  font-weight: 900;
  line-height: 1.25;
}

.input-group input {
  width: 86px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid rgba(67, 24, 138, 0.18);
  text-align: center;
  font-size: 18px;
  font-weight: 900;
  outline: none;
  color: #2a1245;
  background: #fff;
}

.group-pill {
  grid-column: 1 / -1;
  display: inline-flex;
  width: fit-content;
  padding: 8px 14px;
  border-radius: 999px;
  background: #43188a;
  color: #fff;
  font-weight: 900;
  font-size: 12px;
  letter-spacing: 0.05em;
}

.group-pill.mini-group {
  font-size: 10px;
  padding: 6px 11px;
  letter-spacing: 0.09em;
}

.advanced-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.advanced-actions button {
  appearance: none;
  border: 0;
  cursor: pointer;
  border-radius: 14px;
  padding: 14px 18px;
  font-weight: 1000;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.btn-fill { background: #43188a; color: #fff; }
.btn-alt { background: #e9dfff; color: #43188a; }

.page-link-row { display: flex; gap: 12px; flex-wrap: wrap; }

.player-top-controls {
  position: absolute;
  left: 4vw;
  top: 18px;
  z-index: 3;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.qty-mini { min-width: 180px; }
.qty-mini input { width: 100%; }

.compact-btn {
  appearance: none;
  border: 0;
  background: rgba(250, 250, 255, 0.92);
  color: #411986;
  border-radius: 16px;
  padding: 14px 18px;
  font-weight: 1000;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  box-shadow: var(--shadow);
}

.compact-btn:hover { transform: translateY(-2px); }

.mini-card {
  background: rgba(255, 255, 255, 0.92);
  color: #240d4d;
  border-radius: 16px;
  padding: 10px 12px;
  box-shadow: var(--shadow);
  min-width: 190px;
}

.mini-card label {
  display: block;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.mini-card input {
  width: 100%;
  height: 38px;
  border: 1px solid rgba(67, 24, 138, 0.18);
  border-radius: 10px;
  text-align: center;
  font-weight: 900;
  font-size: 18px;
}

.ghost-btn {
  appearance: none;
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  font-weight: 900;
  cursor: pointer;
}

.home-wrap { padding: 0; min-height: 100vh; }

.home-footer-note {
  position: absolute;
  right: 5vw;
  bottom: 6vh;
  z-index: 2;
  max-width: 380px;
  background: rgba(5, 3, 15, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(4px);
  border-radius: 18px;
  padding: 12px 16px;
  color: #fff5fb;
  font-size: 14px;
  line-height: 1.45;
}

.index-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

/* =========================================
   TEMA BASE & TRANSIÇÕES
========================================= */
body[data-mood] { transition: background 0.6s ease, color 0.6s ease; }

body[data-mood="fim_de_tarde"] .scene-top { background-image: url("./assets/fimdetarde.jpg"); }
body[data-mood="party"] .scene-top { background-image: url("./assets/party.jpg"); }
body[data-mood="streets"] .scene-top { background-image: url("./assets/streets.jpg"); }
body[data-mood="neon"] .scene-top { background-image: url("./assets/neon.jpg"); }
body[data-mood="foco"] .scene-top { background-image: url("./assets/foco.jpg"); }

body[data-mood="fim_de_tarde"] .section-player { background: linear-gradient(rgba(10, 5, 20, 0.6), rgba(10, 5, 20, 0.8)), url("./assets/fimdetarde.jpg") center / cover no-repeat; }
body[data-mood="fim_de_tarde"] .player-frame { background: #e07a5f; border: 4px solid #f4a261; border-radius: 20px; }

body[data-mood="party"] .section-player { background: linear-gradient(rgba(8, 8, 20, 0.45), rgba(8, 8, 20, 0.7)), url("./assets/party.jpg") center / cover no-repeat; }
body[data-mood="party"] .player-frame { background: linear-gradient(135deg, #743ce6, #1263d9); border: 5px solid #00c8b3; border-radius: 40px; }

body[data-mood="streets"] .section-player { background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url("./assets/streets.jpg") center / cover no-repeat; }
body[data-mood="streets"] .player-frame { background: #1a1a1a; border: 6px dashed #ff4500; border-radius: 10px; }

body[data-mood="neon"] .section-player { background: linear-gradient(rgba(20, 0, 40, 0.5), rgba(40, 0, 60, 0.8)), url("./assets/neon.jpg") center / cover no-repeat; }
body[data-mood="neon"] .player-frame { background: #2f175d; border-radius: 40px; box-shadow: 0 0 0 4px #1860ff; }

body[data-mood="foco"] .section-player { background: linear-gradient(rgba(10, 20, 30, 0.8), rgba(10, 20, 30, 0.9)), url("./assets/foco.jpg") center / cover no-repeat; }
body[data-mood="foco"] .player-frame { background: #080c27; border-radius: 15px; border: 2px solid #5eead4; }

body[data-mood="equal"] .section-player { background: #000000 !important; }
body[data-mood="equal"] .player-frame { background: #111111; border: 2px solid #ffffff; border-radius: 8px; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }
body[data-mood="equal"] #nome-musica-destaque { color: #ffffff; font-family: "Inter", sans-serif; letter-spacing: 2px; }

body[data-mood="favoritos"] .section-player { background: #000000 !important; }
body[data-mood="favoritos"] .player-frame { background: #0d0005; border: 3px solid #e30e6e; border-radius: 20px; box-shadow: 0 0 20px rgba(227, 14, 110, 0.4); }
body[data-mood="favoritos"] #nome-musica-destaque { color: #e30e6e; font-family: "Bebas Neue", sans-serif; text-shadow: 0 0 8px rgba(227, 14, 110, 0.6); }

.btn-favorito {
  background: none;
  border: none;
  color: #777;
  font-size: 1.2rem;
  cursor: pointer;
  margin-left: auto;
  padding: 0 10px;
  transition: transform 0.2s ease, color 0.2s ease;
}
.btn-favorito:hover { transform: scale(1.2); }
.btn-favorito.curtido { color: #e30e6e; }

@media (max-width: 980px) {
  .scene-bottom { grid-template-columns: 1fr; }
  .queue-card { order: 2; min-height: 260px; max-height: none; }
  .info-wrap { order: 1; }
  .player-actions { position: static; padding: 10px 0 0; width: 100%; justify-content: center; }
  .scene-top { padding-bottom: 18px; align-items: center; justify-content: center; }
  .player-frame { width: min(92vw, 740px); margin-left: 0; margin-top: 58px; }
}

@media (max-width: 900px) {
  .player-top-controls { position: relative; left: auto; top: auto; padding: 16px 16px 0; }
  .scene-top { padding-top: 10px; }
  .home-footer-note { position: relative; right: auto; bottom: auto; margin: 20px 5vw 24px; }
}

@media (max-width: 640px) {
  .advanced-grid { grid-template-columns: 1fr; }
  .player-frame {
    width: 100%;
    max-width: 96vw;
    aspect-ratio: 16 / 10;
    border-radius: 20px;
    margin-top: 64px;
  }
  .player-frame::before { inset: -6px; border-radius: 24px; }
  .arrow-btn {
    min-width: 132px;
    min-height: 56px;
    font-size: 16px;
    padding: 0 20px 0 14px;
  }
  .square-btn {
    min-width: 90px;
    padding: 12px 14px;
    font-size: 13px;
  }
  .scene-label { left: 16px; top: 10px; }
  .player-top-controls {
    gap: 8px;
    flex-direction: column;
    align-items: stretch;
  }
  .mini-card,
  .qty-mini,
  .compact-btn { width: 100%; min-width: 0; }
  #nome-musica-destaque { font-size: clamp(26px, 9.2vw, 44px); }
  .status-pill { width: 100%; text-align: center; }
}

body.android .scene-top {
  min-height: auto;
  padding-top: 12px;
  align-items: center;
  justify-content: center;
}

body.android .player-frame {
  width: min(98vw, 1120px);
  aspect-ratio: 16 / 9;
  margin-top: 58px;
  border-radius: 28px;
  padding: 14px;
}

body.android .player-frame::before {
  inset: -8px;
  border-radius: 34px;
}

body.android #player {
  border-radius: 18px;
}

body.android .player-actions {
  position: static;
  width: 100%;
  justify-content: center;
  gap: 16px;
  padding: 12px 0 2px;
}

body.android .arrow-btn,
body.android .square-btn,
body.android .compact-btn {
  min-height: 54px;
}

@media (max-width: 760px) {
  body.android .player-frame {
    width: 99vw;
    max-width: none;
    aspect-ratio: 16 / 10;
    margin-top: 52px;
    border-radius: 18px;
    padding: 10px;
  }

  body.android .player-frame::before {
    inset: -6px;
    border-radius: 22px;
  }

  body.android #player {
    border-radius: 12px;
  }

  body.android .arrow-btn {
    min-width: 200px;
    min-height: 62px;
    font-size: 20px;
  }

  body.android .square-btn {
    min-width: 154px;
    min-height: 62px;
    font-size: 16px;
  }
}

@media (max-width: 480px) {
  body.android .scene-top {
    padding-left: 6px;
    padding-right: 6px;
  }

  body.android .player-frame {
    width: 100vw;
    margin-top: 48px;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    padding: 8px;
  }

  body.android .player-frame::before {
    inset: -4px;
    border-radius: 18px;
  }

  body.android #player {
    border-radius: 10px;
  }
}

/* =========================================
   TELA DE CARREGAMENTO (LOADING OVERLAY) - CORRIGIDO FORA DE MEDIA QUERIES
========================================= */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: #0c0320;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  visibility: hidden;
}

.loading-card {
  background: linear-gradient(135deg, #26053d, #06010f);
  padding: 32px;
  border-radius: 28px;
  border: 3px solid #e30e6e;
  text-transform: uppercase;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  max-width: 420px;
  width: 90%;
}

.loading-card h2 {
  font-family: 'Bebas Neue', Arial, sans-serif;
  font-size: 28px;
  color: #fff;
  margin: 0 0 10px 0;
  letter-spacing: 2px;
}

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 5px solid rgba(255, 255, 255, 0.1);
  border-top-color: #e30e6e;
  border-radius: 50%;
  margin: 20px auto;
  animation: spinLoading 1s linear infinite;
}

@keyframes spinLoading {
  to { transform: rotate(360deg); }
}

.loading-status {
  font-size: 13px;
  color: #c9bdda;
  letter-spacing: 1px;
  margin-bottom: 24px;
}

.loading-card .mini-card {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  margin: 0;
  padding: 12px;
  border-radius: 16px;
}

.loading-card .mini-card label {
  display: block;
  font-size: 11px;
  color: #ffd5ea;
  margin-bottom: 6px;
  font-weight: 900;
}

.loading-card .mini-card input {
  background: #140313;
  color: #fff;
  border: 1px solid #e30e6e;
  width: 100%;
  height: 38px;
  border-radius: 10px;
  text-align: center;
  font-size: 18px;
  font-weight: 900;
}
</style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <h2>Sincronizando Ritmo</h2>
      <div class="loading-spinner"></div>
      <div class="loading-status">Carregando catálogo musical...</div>
      
      <div class="mini-card">
        <label for="total_musicas_loading">Quantidade de músicas</label>
        <input id="total_musicas_loading" type="number" min="1" value="18" oninput="sincronizarQuantidade(this.value)" />
      </div>
    </div>
  </div>

  <section class="section section-player" id="player-section">
    <div class="scene-top">
      <div class="scene-label">RITMO</div>

      <div class="player-top-controls">
        <button class="compact-btn" onclick="voltarHome()">Voltar</button>
        <button class="compact-btn" onclick="toggleAdvanced(true)">Avançado</button>
        <div class="mini-card qty-mini">

function normalizarPesosMood(pesosOriginais) {
  const entries = Object.entries(pesosOriginais || {});
  const totalOriginal = entries.reduce((acc, [, valor]) => acc + Number(valor || 0), 0);
  if (!entries.length || totalOriginal <= 0) return { ...pesosOriginais };

  const normalizados = entries.map(([key, valor]) => {
    const proporcional = (Number(valor || 0) / totalOriginal) * 100;
    if (proporcional > 0.15 && proporcional < 1) {
      return [key, 1];
    }
    return [key, Math.round(proporcional)];
  });

  const pesosAjustados = Object.fromEntries(normalizados);
  let soma = Object.values(pesosAjustados).reduce((acc, valor) => acc + valor, 0);
  const diferenca = 100 - soma;

  if (diferenca !== 0) {
    const ordenados = Object.entries(pesosAjustados).sort((a, b) => b[1] - a[1]);
    const alvo = ordenados[1] || ordenados[0];
    if (alvo) {
      const [alvoKey, alvoValor] = alvo;
      pesosAjustados[alvoKey] = Math.max(0, alvoValor + diferenca);
    }
  }

  soma = Object.values(pesosAjustados).reduce((acc, valor) => acc + valor, 0);
  if (soma !== 100) {
    const [primeiroKey] = Object.entries(pesosAjustados).sort((a, b) => b[1] - a[1])[0] || [];
    if (primeiroKey) pesosAjustados[primeiroKey] += 100 - soma;
  }

  return pesosAjustados;
}

function embaralhar(lista) {
  const copia = [...lista];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];

}

function calcularVagasExatas(pesos, totalVagas) {
  const somaPesos = Object.values(pesos).reduce((a, b) => a + b, 0);
  if (somaPesos === 0) return null;

  const inteiros = {};
  const restos = [];

  for (const cat in pesos) {
    const valorExato = (pesos[cat] / somaPesos) * totalVagas;
    inteiros[cat] = Math.floor(valorExato);
    restos.push({ cat, resto: valorExato - inteiros[cat] });
  }

  const somaInteiros = Object.values(inteiros).reduce((a, b) => a + b, 0);
  restos.sort((a, b) => b.resto - a.resto);

  for (let i = 0; i < totalVagas - somaInteiros; i++) {
    if (restos[i]) inteiros[restos[i].cat]++;
  }

  return inteiros;
}

function montarPoolPorCategoria(vagas) {
  const pool = {};

  for (const cat in vagas) {
    const quantidade = vagas[cat];
    if (!quantidade) continue;

    const lista = bancoDeMusicas[cat] || [];
    if (!lista.length) continue;

    const embaralhada = embaralhar(lista);
    pool[cat] = [];

    for (let i = 0; i < quantidade; i++) {
      pool[cat].push(embaralhada[i % embaralhada.length]);
    }

    pool[cat] = embaralhar(pool[cat]);
  }

  return pool;
}

function escolherProximaCategoria(pool, categoriaAnterior) {
  const categoriasDisponiveis = Object.keys(pool).filter(cat => pool[cat].length > 0);
  if (!categoriasDisponiveis.length) return null;

  const semRepetir = categoriasDisponiveis.filter(cat => cat !== categoriaAnterior);
  const base = semRepetir.length ? semRepetir : categoriasDisponiveis;

  base.sort((a, b) => pool[b].length - pool[a].length);

  const maiorQuantidade = pool[base[0]].length;
  const empatadas = base.filter(cat => pool[cat].length === maiorQuantidade);

  return empatadas[Math.floor(Math.random() * empatadas.length)];
}

function intercalarPlaylist(pool, totalEsperado) {
  const resultado = [];
  let ultimaCategoria = null;

  while (resultado.length < totalEsperado) {
    const proximaCategoria = escolherProximaCategoria(pool, ultimaCategoria);
    if (!proximaCategoria) break;

    const proximoId = pool[proximaCategoria].shift();

    resultado.push({
      catKey: proximaCategoria,
      cat: nomesCategorias[proximaCategoria],
      id: proximoId,
      titulo: "Carregando nome..."
    });

    ultimaCategoria = proximaCategoria;
  }

  return resultado;
}

async function buscarTituloYoutube(videoId) {
  if (cacheTitulos[videoId]) return cacheTitulos[videoId];

  try {
    const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
    const data = await resp.json();
    const titulo = data.title || `Música ${videoId}`;
    cacheTitulos[videoId] = titulo;
    return titulo;
  } catch (e) {
    return `Música ${videoId}`;
  }
}

  if (event.data === YT.PlayerState.ENDED) {
    if (indiceAtual < playlistAtual.length - 1) {
      tocarIndice(indiceAtual + 1);
    }
  }
}

async function gerarEPlayar() {
  const totalMusicas = Number(document.getElementById("total_musicas").value);
  const pesos = lerPesosDosInputs();

  if (!totalMusicas || totalMusicas < 1) {
    alert("Escolha uma quantidade válida de músicas.");
    return;
  }

  const somaPesos = Object.values(pesos).reduce((a, b) => a + b, 0);
  if (moodAtual !== "favoritos" && somaPesos === 0) {
    alert("Escolha um mood ou preencha pelo menos uma categoria com valor maior que 0.");
    return;
  }

  if (moodAtual === "favoritos") {
    const favoritos = new Set(obterFavoritos());
    const favoritasDisponiveis = [];

    Object.entries(bancoDeMusicas).forEach(([catKey, ids]) => {
      ids.forEach((id) => {
        if (favoritos.has(id)) {
          favoritasDisponiveis.push({
            catKey,
            cat: nomesCategorias[catKey] || catKey.toUpperCase(),
            id,
            titulo: "Carregando nome..."
          });
        }
      });
    });

    playlistAtual = embaralhar(favoritasDisponiveis).slice(0, totalMusicas);
  } else {
    const vagas = calcularVagasExatas(pesos, totalMusicas);
    const pool = montarPoolPorCategoria(vagas);
    playlistAtual = intercalarPlaylist(pool, totalMusicas);
  }
  indiceAtual = 0;

  renderizarPlaylist(playlistAtual);
  atualizarStatus();
  atualizarTituloHeroico();

  if (!playlistAtual.length) {
    alert("Não foi possível montar a playlist com os dados informados.");
    return;
  }

  preencherTitulosDaPlaylist();
  tocarIndice(0);
}

criarInputsCategorias();
atualizarStatus();
atualizarTituloHeroico();
</script>

<script>
function voltarHome() {
  window.location.href = './index.html';
}

function aplicarTemaMood(moodKey) {
  document.body.setAttribute("data-mood", moodKey || "padrao");

  const nomes = {
    fim_de_tarde: "FIM DE TARDE",
    party: "PARTY",
    streets: "STREETS",
    neon: "NEON",
    foco: "FOCO",
    equal: "EQUAL",
    favoritos: "FAVORITOS"
  };

  const label = document.querySelector(".scene-label");
  if (label) label.textContent = nomes[moodKey] || "RITMO";
}

// Vincula dinamicamente ambos os inputs em tempo real
function sincronizarQuantidade(valor) {
  const inputPrincipal = document.getElementById('total_musicas');
  if (inputPrincipal) inputPrincipal.value = valor;
  localStorage.setItem('totalMusicasSelecionado', valor);
}

window.addEventListener('DOMContentLoaded', async () => {
  const totalSalvo = localStorage.getItem('totalMusicasSelecionado') || '18';
  
  const inputPrincipal = document.getElementById('total_musicas');
  if (inputPrincipal) inputPrincipal.value = totalSalvo;
  
  const inputLoading = document.getElementById('total_musicas_loading');
  if (inputLoading) inputLoading.value = totalSalvo;

  const abrirAvancado = localStorage.getItem('abrirAvancado') === '1';
  const moodKey = localStorage.getItem('moodSelecionado');

  if (moodKey && typeof moodsPredefinidos !== 'undefined' && moodsPredefinidos[moodKey]) {
    moodAtual = moodKey;
    aplicarTemaMood(moodKey);
    aplicarPesosNosInputs(moodsPredefinidos[moodKey].pesos);
  }

  // Descarrega o catálogo do Sheets em segundo plano
  await carregarBancoDeMusicas();

  // Remove a tela de carregamento suavemente após o sucesso
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.classList.add('hidden');
  }

  if (moodAtual) {
    gerarEPlayar();
  }

  if (abrirAvancado) {
    toggleAdvanced(true);
  }

  localStorage.removeItem('abrirAvancado');
});
</script>
