<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAKE YOU PLAYLIST - PLAYER</title>
  <style>
    :root{--bg:#0c0320;--paper:#e2a35f;--violet:#401978;--pink:#e30e6e;--pink-2:#ff2a8a;--cream:#f6e9ca;--deep:#06010f;--white:#f8f6ff;--cyan:#37dbe8;--shadow:0 18px 40px rgba(0,0,0,.35)}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}button,input{font:inherit}
    .section-hero{background:linear-gradient(to bottom, rgba(226,163,95,.95) 0 22%, rgba(64,25,120,.88) 22% 56%, rgba(64,25,120,.20) 56% 100%), url('./assets/1000490664.jpg') center bottom/cover no-repeat}
    .hero-top{padding:24px 5vw 10px;display:flex;justify-content:space-between;gap:20px;color:#111;text-transform:uppercase;font-weight:900;font-style:italic}
    .hero-brand h1{margin:0;font-size:clamp(34px,6vw,78px);line-height:.95;color:#2f66b7;letter-spacing:.03em}
    .hero-meta{text-align:right;font-size:clamp(18px,2.3vw,32px);line-height:1.1}.hero-meta small{display:block;margin-top:6px;font-size:clamp(14px,1.6vw,24px)}
    .hero-grid,.extras-grid,.advanced-grid{padding:3vh 5vw 0;display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:18px 24px;max-width:960px}
    .extras-grid,.advanced-grid{padding-top:14px}
    .mood-btn{appearance:none;border:0;min-height:72px;border-radius:18px;background:rgba(245,245,250,.95);color:#3e1084;font-weight:1000;font-size:clamp(20px,2.1vw,34px);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;box-shadow:var(--shadow);text-shadow:-2px 0 #14d4ff,2px 0 #ff248b;padding:14px;outline:3px solid transparent}
    .mood-btn.small{font-size:clamp(16px,1.7vw,24px);letter-spacing:.04em}.mood-btn.active{background:#fff;outline-color:#37dbe8}
    .player-top-controls{padding:18px 5vw 26px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
    .mini-card{background:rgba(250,250,255,.92);color:#3f1485;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);min-width:180px}
    .mini-card label{display:block;font-size:13px;font-weight:900;text-transform:uppercase;margin-bottom:8px;letter-spacing:.08em}
    .mini-card input{width:100%;height:42px;border:2px solid rgba(63,20,133,.18);border-radius:12px;padding:0 12px;font-size:20px;font-weight:900;color:#27103f;background:#fff;outline:none}
    .compact-btn{appearance:none;border:0;background:rgba(250,250,255,.92);color:#411986;border-radius:16px;padding:14px 18px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;box-shadow:var(--shadow)}
    .compact-btn.small{padding:10px 12px;font-size:12px;letter-spacing:.12em;min-height:auto}.compact-btn.active{background:#fff}
    .extras-wrap,.advanced-wrap{display:none}.extras-wrap.open,.advanced-wrap.open{display:block}
    .advanced-panel{margin:0 5vw 20px;background:rgba(5,3,15,.56);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:16px}
    .advanced-grid .input-group{background:rgba(250,250,255,.9);border-radius:14px;padding:12px;color:#32125d;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
    .advanced-grid label{font-size:13px;font-weight:1000;line-height:1.2}.advanced-grid input{width:82px;height:40px;border:1px solid rgba(63,20,133,.15);border-radius:10px;padding:0 10px;text-align:center;font-weight:900;font-size:16px;color:#27103f}
    .section-player{background:linear-gradient(90deg,#02084d 0%,#87648d 100%);min-height:100vh}
    .scene-top{min-height:56vh;background:url('./assets/1000473514.jpg') center center/cover no-repeat;position:relative;padding:26px 4vw 34px;display:flex;align-items:flex-start;justify-content:flex-start}
    .scene-label{position:absolute;top:14px;left:6vw;font-size:clamp(20px,2vw,34px);font-weight:1000;color:var(--cream);text-transform:uppercase;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.3)}
    .mini-admin{position:absolute;right:4vw;top:18px;display:flex;gap:8px;flex-wrap:wrap}
    .player-frame{position:relative;width:min(86vw,720px);aspect-ratio:1.55/1;margin:46px 0 0 4vw;background:linear-gradient(135deg,var(--pink),#d00f5d);border-radius:34px;box-shadow:var(--shadow);padding:24px;isolation:isolate}
    .player-frame::before{content:'';position:absolute;inset:-10px;border-radius:40px;background:linear-gradient(90deg,#000 50%,transparent 50%) 0 0/28px 10px repeat-x,linear-gradient(90deg,#000 50%,transparent 50%) 0 100%/28px 10px repeat-x,linear-gradient(0deg,#000 50%,transparent 50%) 0 0/10px 28px repeat-y,linear-gradient(0deg,#000 50%,transparent 50%) 100% 0/10px 28px repeat-y;z-index:-1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28))}
    #player{width:100%;height:100%;border-radius:18px;overflow:hidden;background:#140313}
    .player-actions{position:absolute;right:4vw;bottom:24px;display:flex;gap:12px;flex-wrap:wrap}
    .arrow-btn{appearance:none;border:0;cursor:pointer;min-width:190px;min-height:74px;border-radius:22px;background:rgba(255,249,255,.92);color:#381272;font-weight:1000;font-size:clamp(20px,2vw,30px);text-transform:uppercase;letter-spacing:.07em;box-shadow:var(--shadow)}
    .scene-bottom{display:grid;grid-template-columns:minmax(320px,1fr) minmax(280px,420px);gap:24px;padding:28px 4vw 40px;align-items:start}
    .info-wrap{display:flex;flex-direction:column;gap:16px}
    .song-card,.queue-card{background:rgba(7,6,22,.68);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:28px;box-shadow:var(--shadow)}
    .song-card{padding:26px}.song-card .label,.queue-card .label{font-size:13px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase;color:#e8d9ff;margin-bottom:12px}
    .song-title{font-size:clamp(24px,4vw,52px);line-height:1.05;font-weight:1000;color:#fff}.song-meta{margin-top:12px;color:#c7f9ff;font-size:16px;font-weight:700}
    .queue-card{padding:18px 16px}.queue-list{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding-right:4px}
    .queue-item{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
    .queue-item.active{background:rgba(227,14,110,.28);border-color:rgba(255,255,255,.2)}
    .queue-num{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:1000}
    .queue-text{display:flex;flex-direction:column;gap:4px}.queue-cat{font-size:11px;color:#9ceefa;font-weight:1000;letter-spacing:.09em;text-transform:uppercase}.queue-title{font-size:14px;color:#fff;line-height:1.35}.empty{padding:14px;color:#ddd}
    @media (max-width:980px){.hero-top{flex-direction:column;align-items:flex-start}.hero-meta{text-align:left}.hero-grid,.extras-grid,.advanced-grid{grid-template-columns:1fr 1fr}.scene-bottom{grid-template-columns:1fr}.player-actions{position:static;padding:0 4vw 24px}.mini-admin{position:static;padding:0 4vw 10px}}
    @media (max-width:640px){.hero-grid,.extras-grid,.advanced-grid{grid-template-columns:1fr}.player-frame{width:100%;margin:58px 0 0}.arrow-btn,.compact-btn{width:100%}}
  </style>
</head>
<body>
  <section class="section-hero">
    <div class="hero-top">
      <div class="hero-brand"><h1>MAKE YOU PLAYLIST</h1></div>
      <div class="hero-meta"><div>• PLAYER</div><small>mood + fila + youtube</small></div>
    </div>
    <div class="hero-grid" id="moods-main"></div>
    <div class="player-top-controls">
      <div class="mini-card"><label for="total_musicas">Quantidade de músicas</label><input id="total_musicas" type="number" min="1" value="18" /></div>
      <button class="compact-btn" id="gerar-btn" type="button">Gerar mix</button>
      <button class="compact-btn" id="outros-btn" type="button">Outros</button>
      <button class="compact-btn" id="advanced-btn" type="button">Opções avançadas</button>
      <button class="compact-btn" id="home-btn" type="button">Voltar</button>
    </div>
    <div class="extras-wrap" id="extras-wrap"><div class="extras-grid" id="moods-extra"></div></div>
    <div class="advanced-wrap" id="advanced-wrap"><div class="advanced-panel"><div class="advanced-grid" id="categorias-grid"></div></div></div>
  </section>
  <section class="section-player">
    <div class="scene-top">
      <div class="scene-label">TOCANDO AGORA</div>
      <div class="mini-admin"><button class="compact-btn small" id="admin-btn" type="button">editar</button></div>
      <div class="player-frame"><div id="player"></div></div>
      <div class="player-actions">
        <button class="arrow-btn" id="anterior-btn" type="button">Anterior</button>
        <button class="arrow-btn" id="proxima-btn" type="button">Próxima</button>
      </div>
    </div>
    <div class="scene-bottom">
      <div class="info-wrap">
        <div class="song-card">
          <div class="label">Faixa atual</div>
          <div class="song-title" id="tocando-agora">Nenhuma música iniciada</div>
          <div class="song-meta" id="proxima-faixa">Próxima: nenhuma</div>
          <div class="song-meta" id="total-gerado">0 músicas na fila</div>
        </div>
      </div>
      <div class="queue-card">
        <div class="label">Fila</div>
        <div class="queue-list" id="playlist-resultado"><div class="empty">Gere uma playlist para ver a fila aqui.</div></div>
      </div>
    </div>
  </section>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="./playlist-data.js"></script>
  <script>
    const PRIMARY_MOOD_KEYS = ['party','noite_sozinho','foco','modo_shonem','noite_neon','faculdade_fm','caminhada'];
    let currentDataSet = loadPlaylistData();
    let categorias = currentDataSet.categorias;
    let bancoDeMusicas = currentDataSet.bancoDeMusicas;
    let moodsPredefinidos = currentDataSet.moodsPredefinidos;
    let nomesCategorias = Object.fromEntries(categorias.map(c => [c.key, c.nome]));
    let selectedMoodKey = localStorage.getItem('moodSelecionado') || '';
    let player, youtubeReady = false, playlistAtual = [], indiceAtual = 0, iniciarQuandoPronto = false;
    const cacheTitulos = {};
    function refreshData(){currentDataSet = loadPlaylistData();categorias = currentDataSet.categorias;bancoDeMusicas = currentDataSet.bancoDeMusicas;moodsPredefinidos = currentDataSet.moodsPredefinidos;nomesCategorias = Object.fromEntries(categorias.map(c => [c.key, c.nome]));}
    function renderAdvancedInputs(){document.getElementById('categorias-grid').innerHTML = categorias.map(cat => `<div class="input-group"><label for="perc_${cat.key}">${cat.nome}</label><input type="number" id="perc_${cat.key}" min="0" value="0" /></div>`).join('');}
    function setWeights(weights = {}){categorias.forEach(cat => {const input = document.getElementById(`perc_${cat.key}`); if (input) input.value = Number(weights[cat.key] || 0);});}
    function getWeights(){const weights = {};categorias.forEach(cat => {const input = document.getElementById(`perc_${cat.key}`);weights[cat.key] = Number(input ? input.value : 0);});return weights;}
    function highlightSelected(){document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.key === selectedMoodKey));}
    function selectMood(key){if (!moodsPredefinidos[key]) return;selectedMoodKey = key;localStorage.setItem('moodSelecionado', key);localStorage.removeItem('playlistCustomPesosTemp');setWeights(moodsPredefinidos[key].pesos || {});highlightSelected();}
    function createMoodButton(key, mood){const text = String(mood.nome || key);return `<button class="mood-btn ${text.length > 12 ? 'small' : ''}" data-key="${key}" type="button">${text}</button>`;}
    function renderMoods(){
      const entries = Object.entries(moodsPredefinidos || {}); const mainEntries = []; const extraEntries = []; const used = new Set();
      PRIMARY_MOOD_KEYS.forEach(key => { if (moodsPredefinidos[key]) { mainEntries.push([key, moodsPredefinidos[key]]); used.add(key); }});
      entries.forEach(([key, mood]) => { if (!used.has(key)) extraEntries.push([key, mood]); });
      document.getElementById('moods-main').innerHTML = mainEntries.map(([key, mood]) => createMoodButton(key, mood)).join('');
      document.getElementById('moods-extra').innerHTML = extraEntries.length ? extraEntries.map(([key, mood]) => createMoodButton(key, mood)).join('') : '';
      document.querySelectorAll('.mood-btn[data-key]').forEach(btn => btn.addEventListener('click', () => selectMood(btn.dataset.key)));
      document.getElementById('outros-btn').style.display = extraEntries.length ? 'inline-block' : 'none';
      highlightSelected();
    }
    function embaralhar(lista){const copia=[...lista];for(let i=copia.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copia[i],copia[j]]=[copia[j],copia[i]];}return copia;}
    function calcularVagasExatas(pesos, totalVagas){const somaPesos = Object.values(pesos).reduce((a,b)=>a+b,0);if(somaPesos===0) return null;const inteiros={};const restos=[];for(const cat in pesos){const valorExato=(pesos[cat]/somaPesos)*totalVagas;inteiros[cat]=Math.floor(valorExato);restos.push({cat,resto:valorExato-inteiros[cat]});}const somaInteiros=Object.values(inteiros).reduce((a,b)=>a+b,0);restos.sort((a,b)=>b.resto-a.resto);for(let i=0;i<totalVagas-somaInteiros;i++){if(restos[i]) inteiros[restos[i].cat]++;}return inteiros;}
    function montarPoolPorCategoria(vagas){const pool={};for(const cat in vagas){const quantidade=vagas[cat];if(!quantidade) continue;const lista=bancoDeMusicas[cat]||[];if(!lista.length) continue;const embaralhada=embaralhar(lista);pool[cat]=[];for(let i=0;i<quantidade;i++){pool[cat].push(embaralhada[i%embaralhada.length]);}pool[cat]=embaralhar(pool[cat]);}return pool;}
    function escolherProximaCategoria(pool, categoriaAnterior){const categoriasDisponiveis=Object.keys(pool).filter(cat=>pool[cat].length>0);if(!categoriasDisponiveis.length) return null;const semRepetir=categoriasDisponiveis.filter(cat=>cat!==categoriaAnterior);const base=semRepetir.length?semRepetir:categoriasDisponiveis;base.sort((a,b)=>pool[b].length-pool[a].length);const maiorQuantidade=pool[base[0]].length;const empatadas=base.filter(cat=>pool[cat].length===maiorQuantidade);return empatadas[Math.floor(Math.random()*empatadas.length)];}
    function intercalarPlaylist(pool, totalEsperado){const resultado=[];let ultimaCategoria=null;while(resultado.length<totalEsperado){const proximaCategoria=escolherProximaCategoria(pool, ultimaCategoria);if(!proximaCategoria) break;const proximoId=pool[proximaCategoria].shift();resultado.push({catKey:proximaCategoria,cat:nomesCategorias[proximaCategoria],id:proximoId,titulo:'Carregando nome...'});ultimaCategoria=proximaCategoria;}return resultado;}
    async function buscarTituloYoutube(videoId){if(cacheTitulos[videoId]) return cacheTitulos[videoId];try{const resp=await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);const data=await resp.json();const titulo=data.title||`Música ${videoId}`;cacheTitulos[videoId]=titulo;return titulo;}catch(e){return `Música ${videoId}`;}}
    async function preencherTitulosDaPlaylist(){for(let i=0;i<playlistAtual.length;i++){const musica=playlistAtual[i];musica.titulo=await buscarTituloYoutube(musica.id);const el=document.querySelector(`#track-${i} .queue-title`);if(el) el.textContent=musica.titulo;if(i===indiceAtual||i===indiceAtual+1) atualizarStatus();}}
    function renderizarPlaylist(playlist){const resDiv=document.getElementById('playlist-resultado');if(!playlist.length){resDiv.innerHTML='<div class="empty">Nenhuma música encontrada para essa combinação.</div>';return;}resDiv.innerHTML=playlist.map((t,i)=>`<div class="queue-item ${i===indiceAtual?'active':''}" id="track-${i}"><div class="queue-num">${i+1}</div><div class="queue-text"><div class="queue-cat">${t.cat}</div><div class="queue-title">${t.titulo||'Carregando nome...'}</div></div></div>`).join('');}
    function atualizarStatus(){const tocandoAgora=document.getElementById('tocando-agora');const proximaFaixa=document.getElementById('proxima-faixa');const totalGerado=document.getElementById('total-gerado');if(!playlistAtual.length){tocandoAgora.textContent='Nenhuma música iniciada';proximaFaixa.textContent='Próxima: nenhuma';totalGerado.textContent='0 músicas na fila';return;}const atual=playlistAtual[indiceAtual];const proxima=playlistAtual[indiceAtual+1];tocandoAgora.textContent=atual?`${atual.titulo||'Carregando nome...'}`:'Nenhuma';proximaFaixa.textContent=proxima?`Próxima: ${proxima.cat} • ${proxima.titulo||'Carregando nome...'}`:'Próxima: fim da fila';totalGerado.textContent=`${playlistAtual.length} música${playlistAtual.length>1?'s':''} na fila`;document.querySelectorAll('.queue-item').forEach(el=>el.classList.remove('active'));const atualEl=document.getElementById(`track-${indiceAtual}`);if(atualEl) atualEl.classList.add('active');}
    function tocarIndice(indice){if(!playlistAtual.length) return;if(indice<0||indice>=playlistAtual.length) return;if(!youtubeReady||!player||typeof player.loadVideoById!=='function'){iniciarQuandoPronto=true;indiceAtual=indice;return;}indiceAtual=indice;const musica=playlistAtual[indiceAtual];player.loadVideoById(musica.id);atualizarStatus();}
    function proximaMusica(){if(indiceAtual<playlistAtual.length-1) tocarIndice(indiceAtual+1);}
    function musicaAnterior(){if(indiceAtual>0) tocarIndice(indiceAtual-1);}
    function onYouTubeIframeAPIReady(){youtubeReady=true;const fallbackId=(bancoDeMusicas.chirriro&&bancoDeMusicas.chirriro[0])||'dQw4w9WgXcQ';player=new YT.Player('player',{height:'100%',width:'100%',videoId:fallbackId,playerVars:{autoplay:0,controls:1,rel:0,modestbranding:1,playsinline:1},events:{onStateChange:event=>{if(event.data===YT.PlayerState.ENDED) proximaMusica();}}});if(iniciarQuandoPronto&&playlistAtual.length){tocarIndice(indiceAtual||0);iniciarQuandoPronto=false;}}
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    function gerarEPlayar(){
      refreshData();
      const totalMusicas = Number(document.getElementById('total_musicas').value || 18);
      if (!totalMusicas || totalMusicas < 1) return alert('Escolha uma quantidade válida de músicas.');
      localStorage.setItem('totalMusicasSelecionado', String(totalMusicas));
      let pesos = null;
      const customRaw = localStorage.getItem('playlistCustomPesosTemp');
      if (customRaw) { try { pesos = JSON.parse(customRaw); } catch(e){} }
      const advancedOpen = document.getElementById('advanced-wrap').classList.contains('open');
      const typedWeights = getWeights();
      const typedSum = Object.values(typedWeights).reduce((acc, value) => acc + Number(value || 0), 0);
      if (!pesos && advancedOpen && typedSum > 0) { pesos = typedWeights; localStorage.setItem('playlistCustomPesosTemp', JSON.stringify(pesos)); }
      if (!pesos && selectedMoodKey && moodsPredefinidos[selectedMoodKey]) pesos = moodsPredefinidos[selectedMoodKey].pesos || {};
      if (!pesos) return alert('Escolha um mood ou preencha as opções avançadas.');
      setWeights(pesos);
      const somaPesos = Object.values(pesos).reduce((a,b)=>a+b,0);
      if (somaPesos === 0) return alert('Os pesos estão zerados.');
      const vagas = calcularVagasExatas(pesos, totalMusicas);
      const pool = montarPoolPorCategoria(vagas);
      playlistAtual = intercalarPlaylist(pool, totalMusicas);
      indiceAtual = 0;
      renderizarPlaylist(playlistAtual);
      atualizarStatus();
      if (!playlistAtual.length) return alert('Não foi possível montar a playlist com os dados informados.');
      preencherTitulosDaPlaylist();
      tocarIndice(0);
    }
    function openAdmin(){const senha = window.prompt('Digite a senha para editar categorias e moods:');if(senha===null) return;if(loginAdmin(senha)) window.location.href='./admin.html'; else alert('Senha incorreta.');}
    document.getElementById('proxima-btn').addEventListener('click', proximaMusica);
    document.getElementById('anterior-btn').addEventListener('click', musicaAnterior);
    document.getElementById('gerar-btn').addEventListener('click', gerarEPlayar);
    document.getElementById('home-btn').addEventListener('click', ()=>window.location.href='./index.html');
    document.getElementById('admin-btn').addEventListener('click', openAdmin);
    document.getElementById('outros-btn').addEventListener('click', ()=>{const extrasWrap=document.getElementById('extras-wrap');extrasWrap.classList.toggle('open');document.getElementById('outros-btn').classList.toggle('active', extrasWrap.classList.contains('open'));});
    document.getElementById('advanced-btn').addEventListener('click', ()=>{const advancedWrap=document.getElementById('advanced-wrap');advancedWrap.classList.toggle('open');document.getElementById('advanced-btn').classList.toggle('active', advancedWrap.classList.contains('open'));if(advancedWrap.classList.contains('open')&&selectedMoodKey&&moodsPredefinidos[selectedMoodKey]) setWeights(moodsPredefinidos[selectedMoodKey].pesos||{});});
    refreshData(); renderAdvancedInputs(); renderMoods();
    const totalSalvo = localStorage.getItem('totalMusicasSelecionado'); if(totalSalvo) document.getElementById('total_musicas').value = totalSalvo;
    const customRaw = localStorage.getItem('playlistCustomPesosTemp');
    if(customRaw){try{setWeights(JSON.parse(customRaw));document.getElementById('advanced-wrap').classList.add('open');document.getElementById('advanced-btn').classList.add('active');}catch(e){}}
    else if(selectedMoodKey && moodsPredefinidos[selectedMoodKey]) setWeights(moodsPredefinidos[selectedMoodKey].pesos||{});
    if(selectedMoodKey || customRaw) gerarEPlayar();
  </script>
</body>
</html>
