<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/><title>MAKE YOU PLAYLIST - PLAYER</title><style>:root{--bg:#0c0320;--paper:#e2a35f;--violet:#401978;--pink:#e30e6e;--pink-2:#ff2a8a;--cream:#f6e9ca;--deep:#06010f;--white:#f8f6ff;--cyan:#37dbe8;--shadow:0 18px 40px rgba(0,0,0,.35);--border:rgba(255,255,255,.18)}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit} body{overflow-x:hidden}.section-hero{background:linear-gradient(to bottom, rgba(226,163,95,.95) 0 22%, rgba(64,25,120,.88) 22% 56%, rgba(64,25,120,.20) 56% 100%), url('./assets/1000490664.jpg') center bottom/cover no-repeat}.hero-top{padding:24px 5vw 10px;display:flex;justify-content:space-between;gap:20px;color:#111;text-transform:uppercase;font-weight:900;font-style:italic}.hero-brand h1{margin:0;font-size:clamp(34px,6vw,78px);line-height:.95;color:#2f66b7;letter-spacing:.03em}.hero-meta{text-align:right;font-size:clamp(18px,2.3vw,32px);line-height:1.1}.hero-meta small{display:block;margin-top:6px;font-size:clamp(14px,1.6vw,24px)}.hero-grid{padding:3vh 5vw 0;display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:18px 24px;max-width:960px}.mood-btn{appearance:none;border:0;min-height:72px;border-radius:18px;background:rgba(245,245,250,.95);color:#3e1084;font-weight:1000;font-size:clamp(20px,2.1vw,34px);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;box-shadow:var(--shadow);text-shadow:-2px 0 #14d4ff,2px 0 #ff248b;padding:14px}.mood-btn.small{font-size:clamp(16px,1.7vw,24px);letter-spacing:.04em}.mood-btn.active{background:#fff;transform:translateY(-2px)}.player-top-controls{padding:18px 5vw 26px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.mini-card{background:rgba(250,250,255,.92);color:#3f1485;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);min-width:180px}.mini-card label{display:block;font-size:13px;font-weight:900;text-transform:uppercase;margin-bottom:8px;letter-spacing:.08em}.mini-card input{width:100%;height:42px;border:2px solid rgba(63,20,133,.18);border-radius:12px;padding:0 12px;font-size:20px;font-weight:900;color:#27103f;background:#fff;outline:none}.compact-btn{appearance:none;border:0;background:rgba(250,250,255,.92);color:#411986;border-radius:16px;padding:14px 18px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;box-shadow:var(--shadow)}.section-player{background:linear-gradient(90deg,#02084d 0%,#87648d 100%);min-height:100vh}.scene-top{min-height:56vh;background:url('./assets/1000473514.jpg') center center/cover no-repeat;position:relative;padding:26px 4vw 34px;display:flex;align-items:flex-start;justify-content:flex-start}.scene-label{position:absolute;top:14px;left:6vw;font-size:clamp(20px,2vw,34px);font-weight:1000;color:var(--cream);text-transform:uppercase;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.3)}.player-frame{position:relative;width:min(86vw,720px);aspect-ratio:1.55/1;margin:46px 0 0 4vw;background:linear-gradient(135deg,var(--pink),#d00f5d);border-radius:34px;box-shadow:var(--shadow);padding:24px;isolation:isolate}.player-frame::before{content:'';position:absolute;inset:-10px;border-radius:40px;background:linear-gradient(90deg,#000 50%,transparent 50%) 0 0/28px 10px repeat-x,linear-gradient(90deg,#000 50%,transparent 50%) 0 100%/28px 10px repeat-x,linear-gradient(0deg,#000 50%,transparent 50%) 0 0/10px 28px repeat-y,linear-gradient(0deg,#000 50%,transparent 50%) 100% 0/10px 28px repeat-y;z-index:-1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28))}#player{width:100%;height:100%;border-radius:18px;overflow:hidden;background:#140313}.player-actions{position:absolute;right:4vw;bottom:24px;display:flex;gap:12px;flex-wrap:wrap}.arrow-btn{appearance:none;border:0;cursor:pointer;min-width:190px;min-height:74px;border-radius:22px;background:rgba(255,249,255,.92);color:#381272;font-weight:1000;font-size:clamp(20px,2vw,30px);text-transform:uppercase;letter-spacing:.07em;box-shadow:var(--shadow)}.scene-bottom{display:grid;grid-template-columns:minmax(320px,1fr) minmax(280px,420px);gap:24px;padding:28px 4vw 40px;align-items:start}.info-wrap{display:flex;flex-direction:column;gap:18px}.song-title{font-size:clamp(34px,5vw,72px);font-weight:1000;line-height:.92;text-transform:uppercase;color:#fff7fb;text-shadow:-3px 0 #16d9ff,3px 0 #ff3d94;letter-spacing:.04em}.status-card,.advanced-panel,.queue-card{background:rgba(8,8,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.status-card{padding:18px 20px}.status-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status-label{font-size:12px;color:#a8c9ff;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:900}.status-value{font-size:15px;line-height:1.45;font-weight:700}.badge{display:inline-flex;align-items:center;padding:8px 12px;background:rgba(227,14,110,.18);border:1px solid rgba(227,14,110,.5);color:#fff;border-radius:999px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.queue-card{padding:18px;min-height:420px}.queue-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.queue-head h2{margin:0;font-size:22px;text-transform:uppercase;letter-spacing:.08em}#playlist-resultado{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}.track-item{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid transparent}.track-item.active{border-color:#ff4e9a;background:rgba(255,78,154,.12)}.track-number{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#fff;color:#381272;font-weight:1000;font-size:14px}.track-category{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(55,219,232,.16);color:#aef8ff;font-size:11px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.track-title{font-size:14px;line-height:1.35}.empty-state{padding:26px 12px;text-align:center;color:#d9d4f6}.advanced-panel{padding:18px 20px;display:none}.advanced-panel.show{display:block}.advanced-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.advanced-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px}.advanced-item label{display:block;font-size:12px;font-weight:1000;color:#a8c9ff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.advanced-item input{width:100%;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(4,4,16,.76);color:#fff;padding:0 12px;font-weight:800}@media (max-width:980px){.hero-top{flex-direction:column;align-items:flex-start}.hero-meta{text-align:left}.hero-grid{grid-template-columns:repeat(2,minmax(150px,1fr));max-width:680px}.scene-bottom{grid-template-columns:1fr}.queue-card{order:2}.player-actions{position:static;padding:16px 4vw 0}.scene-top{padding-bottom:18px}.player-frame{width:min(92vw,720px);margin-left:0}}@media (max-width:640px){.hero-grid{grid-template-columns:1fr 1fr;gap:16px}.mood-btn{min-height:64px;font-size:20px}.mood-btn.small{font-size:15px}.advanced-grid,.status-row{grid-template-columns:1fr}.player-frame{aspect-ratio:1/.78}.arrow-btn{min-width:150px;min-height:62px;font-size:18px}}</style></head><body><section class='section-hero'><div class='hero-top'><div class='hero-brand'><h1>MAKE YOU PLAYLIST</h1></div><div class='hero-meta'><div>• PLAYER</div><small>edite tudo em admin.html</small></div></div><div class='hero-grid' id='moods-player'></div><div class='player-top-controls'><div class='mini-card'><label for='total_musicas'>Quantidade de músicas</label><input id='total_musicas' type='number' min='1' value='18'/></div><button class='compact-btn' onclick='gerarEPlayar()'>GERAR</button><button class='compact-btn' onclick='toggleAdvanced()'>OPÇÕES AVANÇADAS</button><button class='compact-btn' onclick='limparCampos()'>LIMPAR</button><button class='compact-btn' onclick="window.location.href='./admin.html'">EDITAR</button><button class='compact-btn' onclick='voltarHome()'>VOLTAR</button></div></section><section class='section-player' id='player-section'><div class='scene-top'><div class='scene-label'>TOCANDO AGORA</div><div class='player-frame'><div id='player'></div></div><div class='player-actions'><button class='arrow-btn' onclick='musicaAnterior()'>⏮ ANTERIOR</button><button class='arrow-btn' onclick='proximaMusica()'>PRÓXIMA ⏭</button></div></div><div class='scene-bottom'><div class='info-wrap'><div class='song-title' id='nome-musica-destaque'>MUSICA</div><div class='status-card'><div class='status-row'><div><div class='status-label'>Tocando agora</div><div class='status-value' id='tocando-agora'>Nenhuma música iniciada</div></div><div><div class='status-label'>Próxima da fila</div><div class='status-value' id='proxima-faixa'>Nenhuma</div></div></div></div><div class='badge' id='total-gerado'>0 músicas na fila</div><div class='advanced-panel' id='advanced-panel'><div class='advanced-grid' id='categorias-grid'></div></div></div><aside class='queue-card'><div class='queue-head'><h2>FILA</h2></div><div id='playlist-resultado'><div class='empty-state'>Escolha um mood para ver a fila aqui.</div></div></aside></div></section><script src='https://www.youtube.com/iframe_api'></script><script src='./playlist-data.js'></script><script>let categorias=[];let moodsPredefinidos={};let bancoDeMusicas={};let nomesCategorias={};let player;let youtubeReady=false;let playlistAtual=[];let indiceAtual=0;let iniciarQuandoPronto=false;let moodAtual='';const cacheTitulos={};function initData(){const data=loadPlaylistData();categorias=data.categorias||[];moodsPredefinidos=data.moodsPredefinidos||{};bancoDeMusicas=data.bancoDeMusicas||{};nomesCategorias=Object.fromEntries(categorias.map(c=>[c.key,c.nome]));renderMoodButtons();criarInputsCategorias();}function renderMoodButtons(){const wrap=document.getElementById('moods-player');wrap.innerHTML=Object.entries(moodsPredefinidos).map(([key,mood])=>`<button class="mood-btn ${String(mood.nome||'').length>12?'small':''}" data-mood="${key}" onclick="selecionarMood('${key}', this)">${mood.nome}</button>`).join('');}function criarInputsCategorias(){const grid=document.getElementById('categorias-grid');grid.innerHTML=categorias.map(categoria=>`<div class="advanced-item"><label for="perc_${categoria.key}">${categoria.nome}</label><input type="number" id="perc_${categoria.key}" min="0" value="0"/></div>`).join('');}function toggleAdvanced(force=null){const overlay=document.getElementById('advanced-panel');if(force===true){overlay.classList.add('show');return;}if(force===false){overlay.classList.remove('show');return;}overlay.classList.toggle('show');}function aplicarPesosNosInputs(pesos){categorias.forEach(categoria=>{const input=document.getElementById(`perc_${categoria.key}`);if(input) input.value=pesos[categoria.key]??0;});}function marcarMoodAtivo(botao){document.querySelectorAll('.mood-btn').forEach(el=>el.classList.remove('active'));if(botao) botao.classList.add('active');}function selecionarMood(moodKey,botao=null){const mood=moodsPredefinidos[moodKey];if(!mood) return;moodAtual=moodKey;localStorage.setItem('moodSelecionado',moodKey);aplicarPesosNosInputs(mood.pesos);marcarMoodAtivo(botao||document.querySelector(`.mood-btn[data-mood="${moodKey}"]`));gerarEPlayar();const sec=document.getElementById('player-section');if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});}function onYouTubeIframeAPIReady(){youtubeReady=true;const firstKey=categorias[0]&&categorias[0].key;const firstVideo=firstKey&&bancoDeMusicas[firstKey]&&bancoDeMusicas[firstKey][0]?bancoDeMusicas[firstKey][0]:'hhRG7-yacQM';player=new YT.Player('player',{height:'100%',width:'100%',videoId:firstVideo,playerVars:{autoplay:0,controls:1,rel:0,modestbranding:1,playsinline:1},events:{onStateChange:onPlayerStateChange}});if(iniciarQuandoPronto&&playlistAtual.length){tocarIndice(0);iniciarQuandoPronto=false;}}function embaralhar(lista){const copia=[...lista];for(let i=copia.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copia[i],copia[j]]=[copia[j],copia[i]];}return copia;}function lerPesosDosInputs(){const pesos={};categorias.forEach(c=>{const input=document.getElementById(`perc_${c.key}`);pesos[c.key]=Number((input&&input.value)||0);});return pesos;}function limparCampos(){categorias.forEach(c=>{const input=document.getElementById(`perc_${c.key}`);if(input) input.value=0;});moodAtual='';document.querySelectorAll('.mood-btn').forEach(el=>el.classList.remove('active'));playlistAtual=[];indiceAtual=0;renderizarPlaylist([]);atualizarStatus();atualizarTituloHeroico();localStorage.removeItem('moodSelecionado');}function calcularVagasExatas(pesos,totalVagas){const somaPesos=Object.values(pesos).reduce((a,b)=>a+b,0);if(somaPesos===0) return null;const inteiros={};const restos=[];for(const cat in pesos){const valorExato=(pesos[cat]/somaPesos)*totalVagas;inteiros[cat]=Math.floor(valorExato);restos.push({cat,resto:valorExato-inteiros[cat]});}const somaInteiros=Object.values(inteiros).reduce((a,b)=>a+b,0);restos.sort((a,b)=>b.resto-a.resto);for(let i=0;i<totalVagas-somaInteiros;i++){if(restos[i]) inteiros[restos[i].cat]++;}return inteiros;}function montarPoolPorCategoria(vagas){const pool={};for(const cat in vagas){const quantidade=vagas[cat];if(!quantidade) continue;const lista=bancoDeMusicas[cat]||[];if(!lista.length) continue;const embaralhada=embaralhar(lista);pool[cat]=[];for(let i=0;i<quantidade;i++) pool[cat].push(embaralhada[i%embaralhada.length]);pool[cat]=embaralhar(pool[cat]);}return pool;}function escolherProximaCategoria(pool,categoriaAnterior){const disponiveis=Object.keys(pool).filter(cat=>pool[cat].length>0);if(!disponiveis.length) return null;const semRepetir=disponiveis.filter(cat=>cat!==categoriaAnterior);const base=semRepetir.length?semRepetir:disponiveis;base.sort((a,b)=>pool[b].length-pool[a].length);const maior=pool[base[0]].length;const empatadas=base.filter(cat=>pool[cat].length===maior);return empatadas[Math.floor(Math.random()*empatadas.length)];}function intercalarPlaylist(pool,totalEsperado){const resultado=[];let ultimaCategoria=null;while(resultado.length<totalEsperado){const proximaCategoria=escolherProximaCategoria(pool,ultimaCategoria);if(!proximaCategoria) break;const proximoId=pool[proximaCategoria].shift();resultado.push({catKey:proximaCategoria,cat:nomesCategorias[proximaCategoria],id:proximoId,titulo:'Carregando nome...'});ultimaCategoria=proximaCategoria;}return resultado;}async function buscarTituloYoutube(videoId){if(cacheTitulos[videoId]) return cacheTitulos[videoId];try{const resp=await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);const data=await resp.json();const titulo=data.title||`Música ${videoId}`;cacheTitulos[videoId]=titulo;return titulo;}catch(e){return `Música ${videoId}`;}}async function preencherTitulosDaPlaylist(){for(let i=0;i<playlistAtual.length;i++){const musica=playlistAtual[i];musica.titulo=await buscarTituloYoutube(musica.id);const el=document.querySelector(`#track-${i} .track-title`);if(el) el.textContent=musica.titulo;if(i===indiceAtual||i===indiceAtual+1){atualizarStatus();atualizarTituloHeroico();}}}function renderizarPlaylist(playlist){const resDiv=document.getElementById('playlist-resultado');if(!playlist.length){resDiv.innerHTML='<div class="empty-state">Escolha um mood para ver a fila aqui.</div>';return;}resDiv.innerHTML=playlist.map((t,i)=>`<div class="track-item ${i===indiceAtual?'active':''}" id="track-${i}"><div class="track-number">${i+1}</div><div><div class="track-category">${t.cat}</div><div class="track-title">${t.titulo||'Carregando nome...'}</div></div></div>`).join('');}function atualizarTituloHeroico(){const titulo=document.getElementById('nome-musica-destaque');if(!playlistAtual.length){titulo.textContent='MUSICA';return;}const atual=playlistAtual[indiceAtual];titulo.textContent=(atual&&atual.titulo)||'CARREGANDO...';}function atualizarStatus(){const tocandoAgora=document.getElementById('tocando-agora');const proximaFaixa=document.getElementById('proxima-faixa');const totalGerado=document.getElementById('total-gerado');if(!playlistAtual.length){tocandoAgora.textContent='Nenhuma música iniciada';proximaFaixa.textContent='Nenhuma';totalGerado.textContent='0 músicas na fila';return;}const atual=playlistAtual[indiceAtual];const proxima=playlistAtual[indiceAtual+1];tocandoAgora.textContent=atual?`${atual.cat} • ${atual.titulo||'Carregando nome...'}`:'Nenhuma';proximaFaixa.textContent=proxima?`${proxima.cat} • ${proxima.titulo||'Carregando nome...'}`:'Fim da fila';totalGerado.textContent=`${playlistAtual.length} música${playlistAtual.length>1?'s':''} na fila`;}function destacarAtual(){document.querySelectorAll('.track-item').forEach(el=>el.classList.remove('active'));const atual=document.getElementById(`track-${indiceAtual}`);if(atual) atual.classList.add('active');}function tocarIndice(indice){if(!playlistAtual.length) return;if(indice<0||indice>=playlistAtual.length) return;if(!youtubeReady||!player||typeof player.loadVideoById!=='function'){iniciarQuandoPronto=true;return;}indiceAtual=indice;const musica=playlistAtual[indiceAtual];player.loadVideoById(musica.id);atualizarStatus();atualizarTituloHeroico();renderizarPlaylist(playlistAtual);destacarAtual();}function proximaMusica(){if(!playlistAtual.length) return;if(indiceAtual<playlistAtual.length-1) tocarIndice(indiceAtual+1);}function musicaAnterior(){if(!playlistAtual.length) return;if(indiceAtual>0) tocarIndice(indiceAtual-1);}function onPlayerStateChange(event){if(event.data===YT.PlayerState.ENDED){if(indiceAtual<playlistAtual.length-1) tocarIndice(indiceAtual+1);}}async function gerarEPlayar(){const totalMusicas=Number(document.getElementById('total_musicas').value);localStorage.setItem('totalMusicasSelecionado',String(totalMusicas||18));const pesos=lerPesosDosInputs();if(!totalMusicas||totalMusicas<1){alert('Escolha uma quantidade válida de músicas.');return;}const somaPesos=Object.values(pesos).reduce((a,b)=>a+b,0);if(somaPesos===0){alert('Escolha um mood ou preencha pelo menos uma categoria com valor maior que 0.');return;}const vagas=calcularVagasExatas(pesos,totalMusicas);const pool=montarPoolPorCategoria(vagas);playlistAtual=intercalarPlaylist(pool,totalMusicas);indiceAtual=0;renderizarPlaylist(playlistAtual);atualizarStatus();atualizarTituloHeroico();if(!playlistAtual.length){alert('Não foi possível montar a playlist com os dados informados.');return;}preencherTitulosDaPlaylist();tocarIndice(0);}function voltarHome(){window.location.href='./index.html';}window.addEventListener('DOMContentLoaded',()=>{initData();const totalSalvo=localStorage.getItem('totalMusicasSelecionado');if(totalSalvo) document.getElementById('total_musicas').value=totalSalvo;const abrirAvancado=localStorage.getItem('abrirAvancado')==='1';const moodKey=localStorage.getItem('moodSelecionado');if(moodKey&&moodsPredefinidos[moodKey]){moodAtual=moodKey;aplicarPesosNosInputs(moodsPredefinidos[moodKey].pesos);marcarMoodAtivo(document.querySelector(`.mood-btn[data-mood="${moodKey}"]`));gerarEPlayar();}if(abrirAvancado) toggleAdvanced(true);localStorage.removeItem('abrirAvancado');atualizarStatus();atualizarTituloHeroico();});</script></body></html>
