<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMPULSA CURATIO</title>

  <style>
    :root {
      --bg-site: #090c14;
      --surface-1: #0f1729;
      --surface-2: #131f36;
      --text-1: #e9f1ff;
      --text-2: #9eb2d6;
      --accent-1: #5eead4;
      --accent-2: #7c8dff;
      --accent-3: #a855f7;
      --line-soft: rgba(148, 163, 184, .24);
      --sombra: 0 20px 45px rgba(0, 0, 0, .34);
      --foto-home: url("./assets/1000490664.jpg");
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at 20% -10%, #1f2a4a, var(--bg-site) 48%);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text-1);
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      padding: clamp(0px, 1.2vw, 18px);
    }

    .home-page {
      width: min(100%, 1180px);
      min-height: calc(100dvh - 2rem);
      background: linear-gradient(180deg, #0e1628, #0b1322);
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid var(--line-soft);
      box-shadow: 0 14px 56px rgba(0, 0, 0, .58);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topo {
      background:
        linear-gradient(120deg, rgba(124, 141, 255, .11), rgba(94, 234, 212, .07)),
        var(--surface-1);
      text-align: center;
      padding: clamp(14px, 2vw, 22px) clamp(14px, 3vw, 32px) 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-2);
      font-size: clamp(12px, 1.1vw, 15px);
      line-height: 1.35;
    }

    .titulo-principal {
      margin: 8px 0 0;
      font-size: clamp(34px, 6vw, 70px);
      line-height: .95;
      color: #eff6ff;
      letter-spacing: .02em;
      text-shadow: 0 0 32px rgba(94, 234, 212, .15);
    }

    .moods-area {
      background: linear-gradient(180deg, var(--surface-2), #0f1a2e);
      padding: clamp(18px, 2.2vw, 28px) clamp(18px, 3.4vw, 42px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .mood-btn {
      border: 1px solid rgba(124, 141, 255, .38);
      min-height: clamp(52px, 5.2vw, 62px);
      border-radius: 12px;
      padding: 8px 14px;
      background: linear-gradient(135deg, rgba(124, 141, 255, .26), rgba(168, 85, 247, .2));
      color: var(--text-1);
      font-family: inherit;
      font-weight: 700;
      font-size: clamp(16px, 1.9vw, 23px);
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 10px 24px rgba(0, 0, 0, .25);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      text-shadow: none;
    }

    .mood-btn:nth-child(2n) { border-color: rgba(94, 234, 212, .4); background: linear-gradient(135deg, rgba(94, 234, 212, .24), rgba(124, 141, 255, .16)); }
    .mood-btn:nth-child(3n) { border-color: rgba(168, 85, 247, .5); background: linear-gradient(135deg, rgba(168, 85, 247, .25), rgba(124, 141, 255, .22)); }
    .mood-btn:hover {
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), 0 14px 30px rgba(0, 0, 0, .32);
      filter: saturate(1.12) brightness(1.05);
    }
    .mood-btn:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 8px 15px rgba(0, 0, 0, .25); }

    .foto-area {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: clamp(20px, 2.6vw, 36px);
      align-items: end;
      padding: clamp(16px, 2.2vw, 30px);
      min-height: 320px;
      background:
        linear-gradient(145deg, #101b31 0%, #13233f 50%, #162f4f 100%);
      position: relative;
    }

    .foto-card {
      grid-column: 2;
      width: 100%;
      max-width: 760px;
      justify-self: end;
      min-height: 260px;
      aspect-ratio: 16 / 8;
      background-image: var(--foto-home);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 18px;
      box-shadow: var(--sombra);
      border: 1px solid rgba(148, 163, 184, .35);
    }

    .painel-home {
      grid-column: 1;
      display: grid;
      gap: 12px;
      align-self: stretch;
      width: 100%;
      max-width: 270px;
    }

    .quantidade-box,
    .advanced-box {
      position: static;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .2);
    }

    .quantidade-box {
      background: rgba(14, 24, 42, .86);
      border: 1px solid var(--line-soft);
      padding: 12px;
    }

    .quantidade-box label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: .06em;
    }

    .quantidade-box input {
      width: 100%;
      height: 38px;
      border: 1px solid rgba(124, 141, 255, .35);
      border-radius: 10px;
      outline: none;
      text-align: center;
      font-family: "Arial Black", Arial, sans-serif;
      color: var(--text-1);
      font-size: 17px;
      background: rgba(12, 20, 36, .94);
    }

    .advanced-box {
      border: none;
      min-height: 64px;
      border: 1px solid rgba(94, 234, 212, .35);
      background: linear-gradient(135deg, rgba(94, 234, 212, .16), rgba(124, 141, 255, .22));
      color: var(--text-1);
      font-size: 12px;
      line-height: 1.1;
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .08em;
      transition: .16s ease;
    }

    .advanced-box:hover { transform: translateY(-2px); filter: brightness(1.08); }

    .assinatura {
      position: absolute;
      right: clamp(16px, 2.8vw, 30px);
      bottom: 26px;
      z-index: 8;
      color: #d1fae5;
      font-size: clamp(18px, 2.3vw, 26px);
      letter-spacing: 3px;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(94, 234, 212, .35);
    }

    .assinatura::before {
      content: "• BY:";
      display: block;
      font-size: clamp(14px, 1.6vw, 18px);
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .rodape-colorido {
      height: 8px;
      width: 100%;
      position: absolute;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, #5eead4, #7c8dff, #a855f7);
      z-index: 5;
    }

    @media (max-width: 900px) {
      body { display: block; padding: 0; }
      .home-page { width: 100%; border-radius: 0; min-height: 100dvh; }
      .foto-area {
        grid-template-columns: 1fr;
        align-items: start;
        padding-bottom: 66px;
      }
      .foto-card { grid-column: 1; justify-self: center; }
      .painel-home {
        grid-column: 1;
        max-width: 420px;
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }
      .assinatura { bottom: 26px; }
    }

    @media (max-width: 600px) {
      .moods-area { grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 12px; }
      .mood-btn { min-height: 56px; font-size: clamp(18px, 6vw, 25px); }
      .foto-card { min-height: 180px; border-radius: 16px; aspect-ratio: 16 / 9; }
      .painel-home { grid-template-columns: 1fr; max-width: 100%; }
      .assinatura { position: static; margin-top: 6px; text-align: right; justify-self: end; }
    }

    body.android .home-page { border-color: rgba(148, 163, 184, .35); }
    body.android .mood-btn { box-shadow: 0 8px 0 rgba(37, 22, 77, .33); }
  </style>
</head>

<body>
  <main class="home-page">
    <header class="topo">
      <div>(LINK CLICAVEL)</div>
      <div>SOUNDON.GLOBAL</div>
      <div>/BIO/RENANCK</div>
      <h1 class="titulo-principal">IMPULSA CURATIO</h1>
    </header>

    <section class="moods-area">
      <button class="mood-btn" onclick="irParaPlayer('party')">PARTY</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('noite_sozinho')">SOZINHO</button>
      <button class="mood-btn" onclick="irParaPlayer('foco')">FOCO</button>

      <button class="mood-btn pequeno" onclick="irParaPlayer('modo_shonem')">SHONEN</button>
      <button class="mood-btn" onclick="irParaPlayer('noite_neon')">NEON</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('faculdade_fm')">FDT</button>

      <button class="mood-btn pequeno largo" onclick="irParaPlayer('caminhada')">CAMINHADA</button>
      <button class="mood-btn" onclick="irParaPlayer('acordar')">ACORDAR</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('sextap')">SEXTAP</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('bad_trip')">BAD TRIP</button>
    </section>

    <section class="foto-area">
      <div class="foto-card"></div>
      <div class="painel-home">
        <div class="quantidade-box">
          <label for="total_musicas_home">Quantidade</label>
          <input id="total_musicas_home" type="number" min="1" value="18" />
        </div>

        <button class="advanced-box" onclick="abrirAvancado()">
          ABRIR<br>
          OPÇÕES<br>
          AVANÇADAS
        </button>
      </div>

      <div class="assinatura">RENANCK</div>
      <div class="rodape-colorido"></div>
    </section>
  </main>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (isAndroid) {
      document.body.classList.add('android');
    }

    function salvarTotal() {
      const total = document.getElementById('total_musicas_home').value || '18';
      localStorage.setItem('totalMusicasSelecionado', total);
    }

    function irParaPlayer(moodKey) {
      salvarTotal();
      localStorage.setItem('moodSelecionado', moodKey);
      localStorage.removeItem('abrirAvancado');

      if (moodKey === 'bad_trip') {
        window.location.href = './badtrip.html';
        return;
      }

      window.location.href = './player.html';
    }

    function abrirAvancado() {
      salvarTotal();
      localStorage.removeItem('moodSelecionado');
      localStorage.setItem('abrirAvancado', '1');
      window.location.href = './player.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const totalSalvo = localStorage.getItem('totalMusicasSelecionado');
      if (totalSalvo) {
        const input = document.getElementById('total_musicas_home');
        if (input) input.value = totalSalvo;
      }
    });
  </script>
</body>
</html>
