<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/><title>MAKE YOU PLAYLIST</title><style>:root{--bg:#0c0320;--paper:#e2a35f;--violet:#401978;--pink:#e30e6e;--pink-2:#ff2a8a;--cream:#f6e9ca;--deep:#06010f;--white:#f8f6ff;--cyan:#37dbe8;--shadow:0 18px 40px rgba(0,0,0,.35);--border:rgba(255,255,255,.18)}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit} body{overflow-x:hidden}.hero{min-height:100vh;position:relative;background:linear-gradient(to bottom, rgba(226,163,95,.95) 0 22%, rgba(64,25,120,.88) 22% 56%, rgba(64,25,120,.20) 56% 100%), url('./assets/1000490664.jpg') center bottom/cover no-repeat}.top{display:flex;justify-content:space-between;gap:20px;padding:24px 5vw 10px;color:#111;text-transform:uppercase;font-weight:900;font-style:italic}.brand h1{margin:0;font-size:clamp(40px,7vw,86px);line-height:.95;color:#2f66b7;letter-spacing:.03em}.meta{text-align:right;font-size:clamp(20px,2.8vw,42px);line-height:1.1}.meta small{display:block;margin-top:6px;font-size:clamp(14px,1.6vw,24px)}.hero-grid{position:relative;z-index:2;padding:4vh 5vw 0;display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:24px 44px;max-width:960px}.mood-btn{appearance:none;border:0;min-height:82px;border-radius:18px;background:rgba(245,245,250,.95);color:#3e1084;font-weight:1000;font-size:clamp(22px,2.6vw,44px);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease, background .18s ease;text-shadow:-2px 0 #14d4ff, 2px 0 #ff248b;padding:14px}.mood-btn.small{font-size:clamp(18px,2vw,30px);letter-spacing:.04em}.mood-btn:hover{transform:translateY(-3px) scale(1.01);background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.45)}.controls{position:absolute;left:5vw;bottom:9vh;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:14px}.mini-card{background:rgba(250,250,255,.92);color:#3f1485;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);min-width:180px}.mini-card label{display:block;font-size:13px;font-weight:900;text-transform:uppercase;margin-bottom:8px;letter-spacing:.08em}.mini-card input{width:100%;height:42px;border:2px solid rgba(63,20,133,.18);border-radius:12px;padding:0 12px;font-size:20px;font-weight:900;color:#27103f;background:#fff;outline:none}.ghost-btn{appearance:none;border:0;background:rgba(250,250,255,.92);color:#411986;border-radius:18px;padding:16px 18px;font-weight:1000;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(16px,1.6vw,24px);box-shadow:var(--shadow);cursor:pointer}.footer-note{position:absolute;right:5vw;bottom:6vh;z-index:2;max-width:420px;background:rgba(5,3,15,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:18px;padding:12px 16px;color:#fff5fb;font-size:14px;line-height:1.45}.sub-actions{display:flex;gap:12px;flex-wrap:wrap}@media (max-width:980px){.top{flex-direction:column;align-items:flex-start}.meta{text-align:left}.hero-grid{grid-template-columns:repeat(2,minmax(150px,1fr));max-width:680px}.footer-note{position:relative;right:auto;bottom:auto;margin:20px 5vw 24px}.controls{position:relative;left:auto;bottom:auto;padding:18px 5vw 0}}@media (max-width:640px){.hero-grid{grid-template-columns:1fr 1fr;gap:16px}.mood-btn{min-height:72px;font-size:24px}}</style></head><body><section class='hero'><div class='top'><div class='brand'><h1>MAKE YOU PLAYLIST</h1></div><div class='meta'><div>• BY: RENANCK</div><small>soundon.global/bio/renanck</small></div></div><div class='hero-grid' id='moods-home'></div><div class='controls'><div class='mini-card'><label for='total_musicas_home'>Quantidade de músicas</label><input id='total_musicas_home' type='number' min='1' value='18'/></div><div class='sub-actions'><button class='ghost-btn' onclick='abrirAvancado()'>ABRIR OPÇÕES AVANÇADAS</button><button class='ghost-btn' onclick="window.location.href='./admin.html'">EDITAR CATEGORIAS E MOODS</button></div></div><div class='footer-note'>Escolha um mood para ir para a segunda página com a playlist pronta. Para adicionar músicas, categorias ou mexer nos moods, entre em <strong>EDITAR CATEGORIAS E MOODS</strong>.</div></section><script src='./playlist-data.js'></script><script>const moodContainer=document.getElementById('moods-home');function salvarTotal(){const total=document.getElementById('total_musicas_home').value||'18';localStorage.setItem('totalMusicasSelecionado',total);}function irParaPlayer(moodKey){salvarTotal();localStorage.setItem('moodSelecionado',moodKey);localStorage.removeItem('abrirAvancado');window.location.href='./player.html';}function abrirAvancado(){salvarTotal();localStorage.removeItem('moodSelecionado');localStorage.setItem('abrirAvancado','1');window.location.href='./player.html';}function renderMoods(){const data=loadPlaylistData();const moods=Object.entries(data.moodsPredefinidos||{});moodContainer.innerHTML=moods.map(([key,mood])=>`<button class="mood-btn ${String(mood.nome||'').length>12?'small':''}" onclick="irParaPlayer('${key}')">${mood.nome}</button>`).join('');const totalSalvo=localStorage.getItem('totalMusicasSelecionado');if(totalSalvo) document.getElementById('total_musicas_home').value=totalSalvo;}renderMoods();</script></body></html>
