<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMPULSA CURATIO</title>

  <style>
    :root {
      --bg-site: #161224;
      --cinza-topo: #1f1f31;
      --azul-titulo: #63d8ff;
      --azul-claro: #f2f5ff;
      --roxo-1: #6d46ff;
      --roxo-2: #e63ed8;
      --roxo-3: #1dc8ff;
      --ciano-glitch: #00e4ff;
      --rosa-glitch: #ff0b86;
      --verde: #ccffe0;
      --azul-bg: #8eb9ff;
      --preto: #151515;
      --branco: #fff;
      --sombra: 0 16px 35px rgba(0, 0, 0, .28);
      --foto-home: url("./assets/1000490664.jpg");
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #2a2149, var(--bg-site) 55%);
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      color: var(--preto);
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      padding: clamp(0px, 1.2vw, 18px);
    }

    .home-page {
      width: min(100%, 1140px);
      min-height: calc(100dvh - 2rem);
      background: var(--azul-claro);
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 0 42px rgba(0, 0, 0, .5);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topo {
      background:
        linear-gradient(120deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .16)),
        var(--cinza-topo);
      text-align: center;
      padding: clamp(14px, 2vw, 22px) clamp(14px, 3vw, 32px) 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #9cb0ce;
      font-size: clamp(13px, 1.2vw, 18px);
      line-height: 1.35;
    }

    .titulo-principal {
      margin: 8px 0 0;
      font-size: clamp(34px, 6vw, 66px);
      line-height: .92;
      color: var(--azul-titulo);
      letter-spacing: 1px;
      text-shadow: 0 0 24px rgba(99, 216, 255, .42);
    }

    .moods-area {
      background: linear-gradient(180deg, #f8f9ff, #eff3ff);
      padding: clamp(18px, 2.2vw, 28px) clamp(18px, 3.4vw, 42px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 16px;
      border-bottom: 1px solid #d5ddff;
    }

    .mood-btn {
      border: 0;
      min-height: clamp(52px, 5.6vw, 66px);
      border-radius: 14px;
      padding: 8px 14px;
      background: linear-gradient(135deg, var(--roxo-1), var(--roxo-2));
      color: #f6f8ff;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(20px, 2.2vw, 29px);
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 0 rgba(37, 22, 77, .3);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      text-shadow: -2px 0 rgba(0, 0, 0, .45), 1px 1px rgba(0, 0, 0, .3);
    }

    .mood-btn:nth-child(2n) { background: linear-gradient(135deg, #5f78ff, #5de1ff); }
    .mood-btn:nth-child(3n) { background: linear-gradient(135deg, #9a4dff, #ff56b6); }
    .mood-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 13px 0 rgba(37, 22, 77, .3), 0 16px 22px rgba(12, 6, 26, .2);
      filter: saturate(1.1);
    }
    .mood-btn:active { transform: translateY(2px); box-shadow: 0 4px 0 rgba(37, 22, 77, .35); }

    .foto-area {
      display: grid;
      grid-template-columns: minmax(210px, 300px) 1fr;
      gap: clamp(18px, 2.2vw, 32px);
      align-items: end;
      padding: clamp(16px, 2.2vw, 30px);
      min-height: 280px;
      background:
        linear-gradient(145deg, var(--verde) 2%, #d7ebff 42%, #b9b9ff 100%);
      position: relative;
    }

    .foto-card {
      grid-column: 2;
      width: 100%;
      max-width: 760px;
      justify-self: end;
      min-height: 210px;
      aspect-ratio: 16 / 7.2;
      background-image: var(--foto-home);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 20px;
      box-shadow: var(--sombra);
      border: 1px solid rgba(255, 255, 255, .5);
    }

    .painel-home {
      grid-column: 1;
      display: grid;
      gap: 12px;
      align-self: stretch;
      width: 100%;
      max-width: 240px;
    }

    .quantidade-box,
    .advanced-box {
      position: static;
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .14);
    }

    .quantidade-box {
      background: rgba(255, 255, 255, .88);
      padding: 10px 12px;
    }

    .quantidade-box label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      color: #2a1f7f;
      margin-bottom: 6px;
      letter-spacing: .06em;
    }

    .quantidade-box input {
      width: 100%;
      height: 38px;
      border: 1px solid #d6d8ff;
      border-radius: 10px;
      outline: none;
      text-align: center;
      font-family: "Arial Black", Arial, sans-serif;
      color: #1d2165;
      font-size: 18px;
      background: #fff;
    }

    .advanced-box {
      border: none;
      min-height: 64px;
      background: linear-gradient(135deg, #28235d, #342782);
      color: #fff;
      font-size: 14px;
      line-height: 1.1;
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .08em;
      transition: .16s ease;
    }

    .advanced-box:hover { transform: translateY(-2px); filter: brightness(1.08); }

    .assinatura {
      position: absolute;
      right: clamp(16px, 2.4vw, 26px);
      bottom: 34px;
      z-index: 8;
      color: #f3fffa;
      font-size: clamp(20px, 2.6vw, 30px);
      letter-spacing: 3px;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 255, 255, .65), 2px 0 #6eff9d;
    }

    .assinatura::before {
      content: "• BY:";
      display: block;
      font-size: clamp(14px, 1.6vw, 18px);
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .rodape-colorido {
      height: 16px;
      width: 100%;
      position: absolute;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, #0057ff, #8338ec, #ff3edb);
      z-index: 5;
    }

    @media (max-width: 900px) {
      body { display: block; padding: 0; }
      .home-page { width: 100%; border-radius: 0; min-height: 100dvh; }
      .foto-area {
        grid-template-columns: 1fr;
        align-items: start;
        padding-bottom: 66px;
      }
      .foto-card { grid-column: 1; justify-self: center; }
      .painel-home {
        grid-column: 1;
        max-width: 420px;
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }
      .assinatura { bottom: 26px; }
    }

    @media (max-width: 600px) {
      .moods-area { grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 12px; }
      .mood-btn { min-height: 56px; font-size: clamp(18px, 6vw, 25px); }
      .foto-card { min-height: 180px; border-radius: 16px; aspect-ratio: 16 / 9; }
      .painel-home { grid-template-columns: 1fr; max-width: 100%; }
      .assinatura { position: static; margin-top: 6px; text-align: right; justify-self: end; }
    }

    body.android .home-page { border-color: rgba(255, 255, 255, .28); }
    body.android .mood-btn { box-shadow: 0 8px 0 rgba(37, 22, 77, .33); }
  </style>
</head>

<body>
  <main class="home-page">
    <header class="topo">
      <div>(LINK CLICAVEL)</div>
      <div>SOUNDON.GLOBAL</div>
      <div>/BIO/RENANCK</div>
      <h1 class="titulo-principal">IMPULSA CURATIO</h1>
    </header>

    <section class="moods-area">
      <button class="mood-btn" onclick="irParaPlayer('party')">PARTY</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('noite_sozinho')">SOZINHO</button>
      <button class="mood-btn" onclick="irParaPlayer('foco')">FOCO</button>

      <button class="mood-btn pequeno" onclick="irParaPlayer('modo_shonem')">SHONEN</button>
      <button class="mood-btn" onclick="irParaPlayer('noite_neon')">NEON</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('faculdade_fm')">FDT</button>

      <button class="mood-btn pequeno largo" onclick="irParaPlayer('caminhada')">CAMINHADA</button>
      <button class="mood-btn" onclick="irParaPlayer('acordar')">ACORDAR</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('sextap')">SEXTAP</button>
      <button class="mood-btn pequeno" onclick="irParaPlayer('bad_trip')">BAD TRIP</button>
    </section>

    <section class="foto-area">
      <div class="foto-card"></div>
      <div class="painel-home">
        <div class="quantidade-box">
          <label for="total_musicas_home">Quantidade</label>
          <input id="total_musicas_home" type="number" min="1" value="18" />
        </div>

        <button class="advanced-box" onclick="abrirAvancado()">
          ABRIR<br>
          OPÇÕES<br>
          AVANÇADAS
        </button>
      </div>

      <div class="assinatura">RENANCK</div>
      <div class="rodape-colorido"></div>
    </section>
  </main>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);
    if (isAndroid) {
      document.body.classList.add('android');
    }

    function salvarTotal() {
      const total = document.getElementById('total_musicas_home').value || '18';
      localStorage.setItem('totalMusicasSelecionado', total);
    }

    function irParaPlayer(moodKey) {
      salvarTotal();
      localStorage.setItem('moodSelecionado', moodKey);
      localStorage.removeItem('abrirAvancado');

      if (moodKey === 'bad_trip') {
        window.location.href = './badtrip.html';
        return;
      }

      window.location.href = './player.html';
    }

    function abrirAvancado() {
      salvarTotal();
      localStorage.removeItem('moodSelecionado');
      localStorage.setItem('abrirAvancado', '1');
      window.location.href = './player.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const totalSalvo = localStorage.getItem('totalMusicasSelecionado');
      if (totalSalvo) {
        const input = document.getElementById('total_musicas_home');
        if (input) input.value = totalSalvo;
      }
    });
  </script>
</body>
</html>
